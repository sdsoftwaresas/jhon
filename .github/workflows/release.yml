# Jhon's release: on a tag vX.Y.Z (or vX.Y.Z-rc.N) of this public repo, fetch
# the private source sdsoftwaresas/jhon-agents at the same tag, build it per
# arch on a native runner, sign each tarball with cosign keyless and publish
# one GitHub release. The signer identity is this file at that tag:
#   https://github.com/sdsoftwaresas/jhon/.github/workflows/release.yml@refs/tags/<tag>
# `jhon update` (engine/internal/update/verify.go) trusts exactly that, so
# renaming or moving this file breaks every update.

name: release

on:
  push:
    tags:
      - "v*.*.*"

# Per job: the build job signs (id-token), only publish writes (contents).
permissions: {}

# One run per tag, never cancelled: a second push of the same tag waits
# instead of cutting a release in half (T11d).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # engine/internal/update/verify.go's Issuer and IdentityPattern, verbatim.
  SIGNER_ISSUER: https://token.actions.githubusercontent.com
  SIGNER_IDENTITY: ^https://github\.com/sdsoftwaresas/jhon/\.github/workflows/release\.yml@refs/tags/v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-rc\.(0|[1-9]\d*))?$

jobs:
  tag:
    name: check the tag
    runs-on: ubuntu-24.04
    # Every job has a limit: GitHub's default is 6 hours of billed time (T11d, L62).
    timeout-minutes: 5
    permissions: {}
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$'; then
            echo "::error::tag $TAG is not vX.Y.Z or vX.Y.Z-rc.N (no leading zeros)"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *-rc.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    name: build ${{ matrix.arch }}
    needs: tag
    strategy:
      fail-fast: true
      matrix:
        include:
          # Native runners: pack runs the Go tests, so no cross-compile.
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # rc1 built in 14m24s (amd64) and 13m30s (arm64) when it built more than jhon.
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.tag.outputs.version }}
      OUT: ${{ github.workspace }}/dist-out
      # A static jhon: no glibc floor (WSL's Ubuntu 22.04, S3).
      CGO_ENABLED: "0"
    steps:
      - name: Check out jhon-agents at ${{ github.ref_name }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: sdsoftwaresas/jhon-agents
          ref: ${{ github.ref_name }}
          ssh-key: ${{ secrets.JHON_AGENTS_DEPLOY_KEY }}
          path: src
          fetch-depth: 1
          persist-credentials: false

      - name: Install Go (go.mod's go line)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache: false

      - name: Build jhon and pack the release
        working-directory: src
        env:
          JHON_SOURCE: ${{ github.workspace }}/src
        run: |
          go build -trimpath -o build/jhon ./engine/cmd/jhon
          git status --porcelain
          build/jhon release pack --version "$VERSION" --out "$OUT"
          tarball="$OUT/jhon-$VERSION-linux-${{ matrix.arch }}.tar.gz"
          test -f "$tarball" && test -f "$tarball.sha256"
          (cd "$OUT" && sha256sum -c "$(basename "$tarball").sha256")
          # The binary in the tarball is static (no program interpreter).
          check=$(mktemp -d)
          tar -xzf "$tarball" -C "$check" build/jhon
          b="$check/build/jhon"
          if ! h=$(readelf -lW "$b" 2>&1) || ! grep -q 'Program Headers:' <<<"$h"; then
            echo "::error::readelf cannot read $b: $h"; exit 1
          fi
          if grep -q 'program interpreter' <<<"$h"; then
            echo "::error::$(basename "$b") in the tarball is dynamically linked"; exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign and verify the tarball
        run: |
          tarball="$OUT/jhon-$VERSION-linux-${{ matrix.arch }}.tar.gz"
          cosign sign-blob --yes --bundle "$tarball.sigstore.json" "$tarball"
          cosign verify-blob --bundle "$tarball.sigstore.json" \
            --certificate-identity-regexp "$SIGNER_IDENTITY" \
            --certificate-oidc-issuer "$SIGNER_ISSUER" \
            "$tarball"

      - name: Release notes from the CHANGELOG
        if: matrix.arch == 'amd64'
        run: |
          # The `## [X.Y.Z]` section (or `## X.Y.Z`), up to the next `## `.
          # POSIX awk only: Ubuntu's default is mawk.
          awk -v v="$VERSION" '
            /^## / { if (on) exit; h=$0; sub(/^## \[?/, "", h); sub(/\].*$/, "", h); sub(/ .*$/, "", h); on = (h == v); next }
            on { print }
          ' src/CHANGELOG.md > "$OUT/notes.md"
          if [ ! -s "$OUT/notes.md" ]; then
            echo "Jhon $VERSION." > "$OUT/notes.md"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.arch }}
          path: dist-out/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish ${{ github.ref_name }}
    needs: [tag, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist-out
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.tag.outputs.version }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
        run: |
          cd dist-out
          assets=()
          for arch in amd64 arm64; do
            for ext in tar.gz tar.gz.sha256 tar.gz.sigstore.json; do
              f="jhon-$VERSION-linux-$arch.$ext"
              test -f "$f" || { echo "::error::missing $f"; exit 1; }
              assets+=("$f")
            done
          done
          # An rc must be a pre-release: /releases/latest never offers one (S11).
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Jhon $VERSION" --notes-file notes.md "${flags[@]}"
